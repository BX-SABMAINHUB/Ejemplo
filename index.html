<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · BlackList Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #fff;
      color: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      border: 1px solid #000;
      padding: 40px 32px;
    }
    .brand {
      font-size: 10px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #000;
      opacity: 0.5;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 13px;
      color: #000;
      opacity: 0.6;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 8px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #000;
      background: #fff;
      font-size: 14px;
      font-family: inherit;
      color: #000;
      outline: none;
      margin-bottom: 18px;
    }
    input[type="email"]:focus,
    input[type="password"]:focus {
      box-shadow: 0 0 0 2px #000;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #000;
      color: #fff;
      border: 1px solid #000;
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover:not(:disabled) { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: wait; }
    .msg {
      margin-top: 18px;
      padding: 12px 14px;
      border: 1px solid #000;
      font-size: 12px;
      line-height: 1.5;
      display: none;
    }
    .msg.show { display: block; }
    .msg.error { background: #000; color: #fff; }
    .msg.success { background: #fff; color: #000; }
    .msg .code {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      opacity: 0.85;
      display: block;
      margin-top: 4px;
      word-break: break-all;
    }
    .footer {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #000;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.5;
      text-align: center;
    }
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: -2px;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">BlackList · Demo</div>
    <h1>Iniciar sesión</h1>
    <p class="sub">Accede con tu cuenta.</p>

    <form id="loginForm" autocomplete="off">
      <label for="email">Correo</label>
      <input type="email" id="email" placeholder="tu@correo.com" required />

      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" required />

      <button type="submit" id="submitBtn">Entrar</button>
    </form>

    <div class="msg" id="msg"></div>

    <div class="footer">Protected by BlackList API</div>
  </div>

  <script>
    // ============================================
    //  CONFIGURACIÓN — cambia esto por tus datos
    // ============================================
    const API_URL = 'https://blacklst.waevohosting.es/api/v1/check';
    const API_KEY = 'BLWHRyg5lrTSrxzjp4ZjCg8CWKvm0zDAiCKCNq1XzEvxOWAEY364CFsORQJaM';

    // ============================================
    //  Helpers UI
    // ============================================
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');

    function showMsg(text, type = 'error', code = null) {
      msg.className = 'msg show ' + type;
      msg.innerHTML = code
        ? `${text}<span class="code">${code}</span>`
        : text;
    }

    function hideMsg() {
      msg.className = 'msg';
      msg.innerHTML = '';
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitBtn.innerHTML = isLoading
        ? '<span class="spinner"></span>Verificando…'
        : 'Entrar';
    }

    // ============================================
    //  Verificación contra la BlackList API
    // ============================================
    async function checkBlacklist(email) {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': API_KEY,
          },
          body: JSON.stringify({ email }),
        });

        const data = await res.json().catch(() => ({}));

        // 403 → correo en blacklist
        if (res.status === 403) {
          return {
            ok: false,
            blocked: true,
            message: data.error || 'Error 5661, Details: Gmail in Black list',
          };
        }

        // 401 → API key inválida / revocada
        if (res.status === 401) {
          return {
            ok: false,
            blocked: false,
            message: 'Error de configuración: API key inválida o revocada.',
          };
        }

        // 400 → correo mal formado
        if (res.status === 400) {
          return {
            ok: false,
            blocked: false,
            message: 'Correo con formato inválido.',
          };
        }

        // 200 OK
        if (res.ok && data.ok) {
          return { ok: true, blocked: false };
        }

        return {
          ok: false,
          blocked: false,
          message: 'No se pudo verificar el correo. Inténtalo de nuevo.',
        };
      } catch (err) {
        return {
          ok: false,
          blocked: false,
          message: 'Error de red al contactar la API.',
        };
      }
    }

    // ============================================
    //  Submit del formulario
    // ============================================
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMsg();

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email || !password) {
        showMsg('Rellena todos los campos.');
        return;
      }

      setLoading(true);

      // 🔎 Verificamos contra la BlackList API ANTES de permitir el login
      const check = await checkBlacklist(email);

      if (!check.ok) {
        setLoading(false);
        if (check.blocked) {
          showMsg(
            'Acceso denegado. Este correo está baneado.',
            'error',
            check.message
          );
        } else {
          showMsg(check.message, 'error');
        }
        return;
      }

      // ✅ Aquí iría tu autenticación real (Firebase, tu backend, etc.)
      // Por ahora simulamos el login correcto:
      await new Promise((r) => setTimeout(r, 600));

      setLoading(false);
      showMsg('Login correcto. Redirigiendo…', 'success');

      // Redirigir a tu dashboard (cambia por tu ruta real)
      // window.location.href = '/dashboard';
    });
  </script>
</body>
</html>
